[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.3.2"
description = "A local-first, access-first literature workflow for research projects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "bibtexparser>=1.4,<2",
    "pypdf>=5.0,<7",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/LIMYOYO/research-radar"
Repository = "https://github.com/LIMYOYO/research-radar.git"
Issues = "https://github.com/LIMYOYO/research-radar/issues"

[project.optional-dependencies]
dev = [
    "coverage>=7.0,<8",
]

[project.scripts]
research-radar = "research_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_radar = ["templates/*.md"]
