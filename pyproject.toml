[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.1.0"
description = "A local-first, access-first literature workflow for research projects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pypdf>=5.0,<7",
]

[project.scripts]
research-radar = "research_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
